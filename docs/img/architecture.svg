<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" aria-label="Kairos architecture: the match engine feeds one stats layer; the AI desk on Microsoft Foundry, the ghost engine and the MCP server all use its tools; the site runs on Azure Static Web Apps, live try-outs on Azure Container Apps, built and deployed by GitHub Actions.">
