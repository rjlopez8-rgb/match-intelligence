[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchagents"
version = "0.1.0"
description = "The AI broadcast desk: seven agents on Microsoft Agent Framework and Foundry"
requires-python = ">=3.11"
dependencies = [
    "matchstats",
    "openai>=2.0",
    "agent-framework-core>=1.22,<2",
    "agent-framework-openai>=1.17,<2",
]

[project.scripts]
matchagents = "matchagents.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
