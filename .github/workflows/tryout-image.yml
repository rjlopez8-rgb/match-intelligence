# Builds the try-out server image (engine only) and pushes it to GitHub's container registry (free).
# Azure Container Apps runs it (scale to zero, 1 replica): see docs/DEPLOY.md.
name: Try-out server image

on:
  push:
    branches: [main]
    paths: ["engine/**", "data/demo/riv-kin-1119/tryouts/**", "deploy/tryout-server/**", ".github/workflows/tryout-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry names must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/match-intelligence-tryouts" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/tryout-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
