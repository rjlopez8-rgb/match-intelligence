# Tests on every push and pull request. Offline: no model calls, no Azure, $0.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "*/pyproject.toml"
      - name: Install the three packages
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.5.3" -e "./engine[dev]" -e "./stats[dev,mcp]" -e "./agents[dev]"
      - name: Engine tests
        working-directory: engine
        run: pytest
      - name: Stats tests (incl. the MCP server)
        working-directory: stats
        run: pytest
      - name: Agent tests (scripted models, no network)
        working-directory: agents
        env:
          AZURE_OPENAI_ENDPOINT: https://test-resource.services.ai.azure.com
          AZURE_OPENAI_API_KEY: test-key
        run: pytest
