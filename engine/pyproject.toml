[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchengine"
version = "1.0.0"
description = "Synthetic football match engine: agent-based 10 Hz simulation that streams football-realistic events and tracking data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
plots = ["matplotlib>=3.8"]

[project.scripts]
matchengine = "matchengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matchengine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
